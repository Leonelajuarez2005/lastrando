<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - LASTRANDO</title>

  <!-- Favicon / Logo en la pestaña -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tipografía Google Font: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configuración de Colores y Tipografía del Design System -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            carbon: '#1A1A1A',
            crema: '#F6F4F1',
            piedra: '#C9C1B4',
            nude: '#F6DFCD',
            blanco: '#FFFFFF',
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-crema text-carbon font-sans antialiased flex flex-col min-h-screen">

  <!-- HEADER Y BARRA DE NAVEGACIÓN -->
  <header class="sticky top-0 z-50 bg-crema border-b border-piedra px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center">
        <img src="logo.png" 
             alt="Logo de Lastrando escrito a mano" 
             class="h-10 sm:h-12 w-auto object-contain">
      </a>

      <!-- Menú de navegación principal con Contacto activo -->
      <nav>
        <ul class="flex flex-wrap justify-center gap-2 text-xs sm:text-sm font-semibold">
          <li><a href="index.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Inicio</a></li>
          <li><a href="merienda.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Merienda</a></li>
          <li><a href="parrillas.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Parrillas</a></li>
          <li><a href="fastfood.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Fast Food</a></li>
          <li><a href="bares.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Bares</a></li>
          <li><a href="internacional.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Internacional</a></li>
          <li><a href="reservar.html" class="px-3 py-1.5 rounded-full bg-blanco hover:bg-nude transition border border-piedra">Reservar</a></li>
          <li><a href="contacto.html" class="px-3 py-1.5 rounded-full bg-nude text-carbon border border-piedra">Contacto</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-8">
    
    <div class="text-center space-y-2">
      <h1 class="text-2xl sm:text-3xl font-bold">Envianos tu Consulta</h1>
      <p class="text-xs sm:text-sm text-carbon/70">¿Tenés alguna duda, sugerencia o recomendación de un local? Escribinos y te responderemos a la brevedad.</p>
    </div>

    <!-- FORMULARIO DE CONTACTO -->
    <section class="bg-blanco p-6 sm:p-8 rounded-2xl border border-piedra shadow-sm max-w-2xl mx-auto space-y-4">
      <form id="formContacto" class="space-y-4">
        <div>
          <label for="nombreContacto" class="block text-xs font-semibold uppercase mb-1">Nombre completo:</label>
          <input type="text" id="nombreContacto" required placeholder="Tu nombre" class="w-full text-sm p-3 bg-crema border border-piedra rounded-xl focus:outline-none focus:ring-2 focus:ring-nude">
        </div>
        <div>
          <label for="emailContacto" class="block text-xs font-semibold uppercase mb-1">Correo Electrónico:</label>
          <input type="email" id="emailContacto" required placeholder="ejemplo@email.com" class="w-full text-sm p-3 bg-crema border border-piedra rounded-xl focus:outline-none focus:ring-2 focus:ring-nude">
        </div>
        <div>
          <label for="motivo" class="block text-xs font-semibold uppercase mb-1">Motivo de la consulta:</label>
          <select id="motivo" class="w-full text-sm p-3 bg-crema border border-piedra rounded-xl focus:outline-none focus:ring-2 focus:ring-nude">
            <option>Recomendación de local</option>
            <option>Pertenecer al recorrido</option>
            <option>Sugerencia / Comentario</option>
            <option>Consulta general</option>
          </select>
        </div>
        <div>
          <label for="mensaje" class="block text-xs font-semibold uppercase mb-1">Mensaje:</label>
          <textarea id="mensaje" rows="4" required placeholder="Escribí tu mensaje aquí..." class="w-full text-sm p-3 bg-crema border border-piedra rounded-xl focus:outline-none focus:ring-2 focus:ring-nude"></textarea>
        </div>
        <button type="submit" class="w-full bg-nude hover:bg-nude/80 text-carbon font-bold text-sm py-3 px-4 rounded-xl border border-piedra transition shadow-sm">
          ENVIAR MENSAJE
        </button>
      </form>

      <!-- Mensaje de confirmación funcional -->
      <div id="mensajeContacto" class="hidden p-4 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-xl text-xs sm:text-sm"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-crema border-t border-piedra py-6 text-center text-xs text-carbon/70">
    <p>&copy; 2026 LASTRANDO — Grupo 3 (UADE). Desarrollo Web.</p>
  </footer>

  <!-- SCRIPT JAVASCRIPT DE VALIDACIÓN -->
  <script>
    const formContacto = document.getElementById('formContacto');
    const mensajeContacto = document.getElementById('mensajeContacto');

    formContacto.addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombreContacto').value;
      mensajeContacto.classList.remove('hidden');
      mensajeContacto.innerHTML = `<strong>¡Consulta enviada con éxito!</strong><br>Gracias ${nombre}, nos pondremos en contacto a la brevedad. (Simulación funcional de formulario).`;
      formContacto.reset();
    });
  </script>
</body>
</html>
